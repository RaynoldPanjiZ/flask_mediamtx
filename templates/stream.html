{% extends "layout.html" %}
{% block content %}

<h2>Video Streams</h2>
<p>Displaying {{ streams|length }} streams:</p>

<div class="row g-3">

    {% for name, src in streams.items() %}
    <div class="col-md-6">
        <div class="card">

            <div class="card-header bg-dark text-white d-flex justify-content-between">
                <span>{{ name }}</span>

                <!-- Record Button UI -->
                <button id="btn-{{ name }}" class="btn btn-sm btn-danger"
                        onclick="startRecord('{{ name }}')">
                    Record
                </button>
            </div>

            <div class="card-body p-2">
                <iframe
                    src="http://{{ host }}:8889/{{ name }}"
                    style="width:100%; height:360px; border:0;"
                    allow="autoplay"
                    scrolling="no">
                </iframe>
            </div>

        </div>
    </div>
    {% endfor %}

</div>


<script>
function startRecord(channel) {
    const btn = document.getElementById("btn-" + channel);
    btn.disabled = true;
    btn.innerText = "Recording...";

    // START RECORD
    fetch(`/api/record/start/${channel}`)
        .then(r => r.json())
        .then(data => {
            console.log("Recording started:", data);

            // STOP otomatis setelah 10 menit (600.000 ms)
            setTimeout(() => stopRecord(channel), 600000);
        })
        .catch(err => {
            console.error(err);
            btn.disabled = false;
            btn.innerText = "Record";
        });
}

function stopRecord(channel) {
    const btn = document.getElementById("btn-" + channel);

    fetch(`/api/record/stop/${channel}`)
        .then(r => r.json())
        .then(data => {
            console.log("Recording stopped:", data);
            btn.disabled = false;
            btn.innerText = "Record";
        })
        .catch(err => {
            console.error(err);
            btn.disabled = false;
            btn.innerText = "Record";
        });
}
</script>

{% endblock %}
