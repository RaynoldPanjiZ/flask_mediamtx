{% extends "layout.html" %}
{% block content %}

<h2>Video Streams</h2>
<p>Displaying {{ streams|length }} streams:</p>

<div class="row g-3">

    {% for name, src in streams.items() %}
    <div class="col-md-6">
        <div class="card">

            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span>{{ name }}</span>

                <div>
                    <!-- Record Button -->
                    <button id="btn-rec-{{ name }}"
                            class="btn btn-sm btn-danger me-1"
                            onclick="startRecord('{{ name }}')">
                        Record
                    </button>

                    <!-- Stop Button -->
                    <button id="btn-stop-{{ name }}"
                            class="btn btn-sm btn-secondary"
                            onclick="stopRecord('{{ name }}')"
                            disabled>
                        Stop
                    </button>
                </div>
            </div>

            <div class="card-body p-2">
                <iframe
                    src="http://{{ host }}:8889/{{ name }}"
                    style="width:100%; height:360px; border:0;"
                    allow="autoplay"
                    scrolling="no">
                </iframe>
            </div>

        </div>
    </div>
    {% endfor %}

</div>

<script>
let timers = {};  // menyimpan setTimeout per-channel

function startRecord(channel) {
    const recBtn = document.getElementById("btn-rec-" + channel);
    const stopBtn = document.getElementById("btn-stop-" + channel);

    recBtn.disabled = true;
    recBtn.innerText = "Recording...";
    stopBtn.disabled = false;

    fetch(`/api/record/start/${channel}`)
        .then(r => r.json())
        .then(data => {
            console.log("Recording started:", data);

            // auto stop setelah 10 menit = 600.000 ms
            timers[channel] = setTimeout(() => {
                stopRecord(channel);
            }, 600000);
        })
        .catch(err => {
            console.error(err);
            recBtn.disabled = false;
            recBtn.innerText = "Record";
            stopBtn.disabled = true;
        });
}

function stopRecord(channel) {
    const recBtn = document.getElementById("btn-rec-" + channel);
    const stopBtn = document.getElementById("btn-stop-" + channel);

    // kalau ada timer dari auto-stop, hentikan
    if (timers[channel]) {
        clearTimeout(timers[channel]);
        delete timers[channel];
    }

    stopBtn.disabled = true;

    fetch(`/api/record/stop/${channel}`)
        .then(r => r.json())
        .then(data => {
            console.log("Recording stopped:", data);

            recBtn.disabled = false;
            recBtn.innerText = "Record";
        })
        .catch(err => {
            console.error(err);

            stopBtn.disabled = false;  
            recBtn.disabled = false;
            recBtn.innerText = "Record";
        });
}
</script>

{% endblock %}
