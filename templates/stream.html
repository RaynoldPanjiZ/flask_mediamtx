{% extends "layout.html" %}
{% block content %}

<h2>Video Streams</h2>
<p>Displaying {{ streams|length }} streams:</p>

<div class="row g-3">

    {% for name, src in streams.items() %}
    <div class="col-md-6">
        <div class="card">

            <div class="card-header bg-dark text-white">
                {{ name }}
            </div>

            <div class="card-body p-2">
                <iframe
                    src="http://{{ host }}:8889/{{ name }}"
                    style="width:100%; height:360px; border:0;"
                    allow="autoplay"
                    scrolling="no">
                </iframe>
            </div>

        </div>
    </div>
    {% endfor %}

</div>

{% endblock %}
